name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      REPO_URL: https://github.com/TeamWin/android_manifest.git
      BRANCH: twrp-12.1
      DEVICE_TREE: https://github.com/VALFOR42/android_device_tecno_TECNO-LG7n3
      DEVICE_PATH: device/tecno/TECNO-LG7n
      DEVICE_NAME: TECNO-LG7n

    steps:
    - name: Set up job
      run: echo "Starting TWRP build workflow..."

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python-is-python3

    - name: Setup git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

    - name: Initialize repo
      run: |
        mkdir ~/twrp && cd ~/twrp
        repo init --no-repo-verify -u $REPO_URL -b $BRANCH --git-lfs
        repo sync -c --no-tags --force-sync --optimized-fetch --prune

    - name: Clone device tree
      run: |
        cd ~/twrp
        git clone $DEVICE_TREE $DEVICE_PATH

    - name: Build TWRP (boot.img)
      run: |
        cd ~/twrp
        source build/envsetup.sh
        lunch twrp_${DEVICE_NAME}-eng
        mka recoveryimage -j$(nproc)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-${{ env.DEVICE_NAME }}
        path: out/target/product/${{ env.DEVICE_NAME }}/recovery.img

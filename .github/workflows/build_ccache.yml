name: TWRP Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          git-core gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 libncurses5:i386 libncurses5-dev:i386 \
          lib32z1 lib32stdc++6 python3 python3-pip repo bc

    - name: Setup repo tool (if needed)
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Initialize repo (optional)
      run: |
        # Eğer TWRP kaynakları repo ile çekilecekse
        repo init -u https://github.com/TeamWin/android_manifest.git -b twrp-12.1
        repo sync -c -j$(nproc)

    - name: Prepare build environment
      run: |
        source build/envsetup.sh
        lunch omni_TECNO-LG7n-eng

    - name: Build recovery image
      run: |
        mka recoveryimage -j$(nproc)

    - name: Upload recovery image
      uses: actions/upload-artifact@v4
      with:
        name: recovery-img
        path: out/target/product/TECNO-LG7n/recovery.img

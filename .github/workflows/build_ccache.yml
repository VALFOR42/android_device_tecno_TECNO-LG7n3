name: TWRP Build (TECNO-LG7n)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on:  ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig python3 python-is-python3

    - name: Setup git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Install repo tool
      run: |
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
        chmod a+x ~/repo
        sudo mv ~/repo /usr/local/bin/repo

    - name: Initialize repo
      run: |
        mkdir ~/twrp && cd ~/twrp
        repo init --no-repo-verify -u https://github.com/TeamWin/android_manifest.git -b twrp-12.1
        repo sync -c --no-tags --force-sync --optimized-fetch --prune --quiet

    - name: Clone device tree
      run: |
        cd ~/twrp
        git clone https://github.com/YourUsername/android_device_tecno_TECNO-LG7n.git device/tecno/TECNO-LG7n

    - name: Build TWRP (boot.img)
      run: |
        cd ~/twrp
        source build/envsetup.sh
        lunch omni_TECNO-LG7n-eng
        mka bootimage

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: twrp-boot
        path: ~/twrp/out/target/product/TECNO-LG7n/boot.img

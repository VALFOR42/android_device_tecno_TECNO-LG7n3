name: Build TWRP for TECNO‑LG7n

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile TWRP Recovery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev openjdk-8-jdk

      - name: Initialize TWRP source
        run: |
          mkdir twrp && cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -j$(nproc) --force-sync

      - name: Add device tree
        run: |
          cd twrp
          rm -rf device/tecno/TECNO‑LG7n3
          mkdir -p device/tecno
          cp -r ../device/tecno/TECNO‑LG7n3 device/tecno/TECNO‑LG7n3

      - name: (Optional) Include kernel source
        run: |
          cd twrp
          mkdir -p kernel/tecno
          cd kernel/tecno
          git clone https://github.com/VALFOR42/android_kernel_tecno_TECNO‑LG7n3.git TECNO‑LG7n3 || echo "Kernel source not provided. Using stock kernel."

      - name: Setup build environment
        run: |
          cd twrp
          source build/envsetup.sh
          lunch omni_TECNO‑LG7n-eng

      - name: Build recovery image
        run: |
          cd twrp
          make clean
          mka recoveryimage -j$(nproc)

      - name: Upload the recovery.img artifact
        uses: actions/upload-artifact@v3
        with:
          name: twrp_recovery_LG7n
          path: twrp/out/target/product/TECNO‑LG7n3/recovery.img